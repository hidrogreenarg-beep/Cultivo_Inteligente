<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de Cultivo — HIDROGREEN</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background-color:#F2EFE4;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(63,107,63,0.10) 23px, rgba(63,107,63,0.10) 24px),

    padding:20px;
  }
  .card{
    background:#FBFAF5; border:1.5px solid #CBC3A8; border-radius:10px;
    padding:36px 32px; max-width:380px; width:100%; text-align:center;
  }
  h1{font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:26px; color:#2A4A2A; margin:0 0 6px;}
  p{color:#54614F; font-size:14px; line-height:1.5; margin:0 0 24px;}
  a.btn{
    display:inline-block; background:#2A4A2A; color:#FBF8F0; font-weight:600; font-size:15px;
    padding:13px 26px; border-radius:6px; text-decoration:none;
  }
  a.btn:hover{background:#1F3A1F;}
</style>
</head>
<body>
  <div class="card">
    <h1>Cuaderno de Cultivo</h1>
    <p>San José Cultiva — HIDROGREEN</p>
    <a class="btn" href="https://claude.ai/public/artifacts/f124ffc9-5df7-41ce-83fc-86d266cf289c" target="_blank" rel="noopener noreferrer">
