<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de Cultivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F2EFE4;
    --grid:rgba(63,107,63,0.10);
    --grid-bold:rgba(63,107,63,0.18);
    --ink:#1F2A1F;
    --ink-soft:#54614F;
    --leaf:#3F6B3F;
    --leaf-dark:#2A4A2A;
    --clay:#A9673B;
    --clay-dark:#8A5230;
    --amber:#B9822C;
    --amber-bg:#F8EBD3;
    --danger:#B4432E;
    --danger-bg:#F6E1DB;
    --card:#FBFAF5;
    --border:#CBC3A8;
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 23px, var(--grid) 23px, var(--grid) 24px),
      repeating-linear-gradient(90deg, transparent, transparent 23px, var(--grid) 23px, var(--grid) 24px);
    min-height:100vh;
    padding:0 0 48px 0;
  }
  .wrap{max-width:760px; margin:0 auto; padding:22px 16px 0;}

  /* Header */
  header.top{padding:6px 4px 18px;}
  .eyebrow-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:600;
    font-size:30px;
    margin:0;
    color:var(--leaf-dark);
    letter-spacing:0.2px;
  }
  .sub{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .client-name-row{margin-top:10px;}
  #fantasyNameInput{
    font-family:var(--serif); font-style:italic; font-size:16px; color:var(--leaf-dark);
    background:transparent; border:none; border-bottom:1.5px dashed var(--border);
    padding:4px 2px 6px; width:100%; max-width:320px; outline:none;
  }
  #fantasyNameInput:focus{border-bottom-style:solid; border-color:var(--leaf);}
  #fantasyNameInput::placeholder{color:var(--ink-soft); opacity:0.55; font-style:italic;}
  .client-code-tag{font-family:var(--mono); font-size:10px; color:var(--ink-soft); opacity:0.5; margin-top:6px;}
  .client-code-row{display:flex; align-items:center; gap:10px;}

  /* Tabs styled like folder tabs */
  .tabs{display:flex; gap:6px; margin-top:20px; border-bottom:2px solid var(--leaf-dark);}
  .tab-btn{
    font-family:var(--sans); font-weight:500; font-size:14.5px;
    background:#E7E2D2; color:var(--ink-soft);
    border:1.5px solid var(--border); border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:9px 16px 8px;
    cursor:pointer;
    transform:translateY(2px);
    transition:transform .12s ease, background .12s ease;
  }
  .tab-btn.active{
    background:var(--card); color:var(--leaf-dark); font-weight:600;
    border-color:var(--leaf-dark);
    transform:translateY(0);
  }

  main{margin-top:0;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* Section cards */
  .field-section{
    background:var(--card);
    border:1.5px solid var(--border);
    border-left:5px solid var(--leaf);
    border-radius:2px 10px 10px 2px;
    padding:18px 18px 8px;
    margin:18px 0;
  }
  .field-section.amb{border-left-color:var(--clay);}
  .field-section.planta{border-left-color:var(--amber);}
  .field-section.resp{border-left-color:var(--ink-soft);}

  .sec-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .sec-head svg{flex-shrink:0;}
  .sec-head h2{
    font-family:var(--serif); font-weight:600; font-size:19px; margin:0; color:var(--ink);
  }

  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; margin-bottom:16px;}
  .field-row.single{grid-template-columns:1fr;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .field .hint{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); opacity:0.75;}
  .field .hint.warn{color:var(--amber); opacity:1; font-weight:500;}
  .field .hint.bad{color:var(--danger); opacity:1; font-weight:500;}

  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    font-family:var(--mono);
    font-size:15px;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--border);
    padding:6px 2px 7px;
    outline:none;
    width:100%;
  }
  select{font-family:var(--sans); font-size:14px; appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 12px) center, calc(100% - 7px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:22px;}
  textarea{border:1.5px solid var(--border); border-radius:4px; padding:8px; min-height:64px; resize:vertical; font-family:var(--sans); font-size:14.5px;}
  input:focus, select:focus, textarea:focus{border-color:var(--leaf); border-width:2px; padding-bottom:6px;}
  input.flag-warn{border-color:var(--amber);}
  input.flag-bad{border-color:var(--danger);}

  /* Stamp toggle (vigor) */
  .stamp-row{display:flex; gap:12px; margin-bottom:16px; align-items:stretch;}
  .stamp{
    flex:1; display:flex; align-items:center; justify-content:center;
    height:44px; box-sizing:border-box;
    border:1.5px solid var(--border); border-radius:6px;
    font-family:var(--mono); font-size:13.5px; font-weight:500; cursor:pointer; color:var(--ink-soft); user-select:none;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .stamp.sano.selected{border-color:var(--leaf); color:var(--leaf-dark); background:rgba(63,107,63,0.08); font-weight:600;}
  .stamp.alerta.selected{border-color:var(--danger); color:var(--danger); background:var(--danger-bg); font-weight:600;}

  /* checkbox pills */
  .check-row{display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:16px;}
  .check-item{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink);}
  .check-item input{width:15px; height:15px; accent-color:var(--leaf);}

  .otro-text{margin-top:6px;}

  /* submit */
  .submit-row{padding:8px 0 26px; display:flex; justify-content:flex-end;}
  .btn-save{
    font-family:var(--sans); font-weight:600; font-size:14.5px;
    background:var(--clay); color:#FBF8F0; border:none; border-radius:5px;
    padding:12px 22px; cursor:pointer; letter-spacing:0.2px;
    box-shadow:0 2px 0 var(--clay-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-save:active{transform:translateY(2px); box-shadow:0 0 0 var(--clay-dark);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--leaf-dark); color:#F2EFE4; font-family:var(--sans); font-size:14px;
    padding:11px 20px; border-radius:6px; opacity:0; transition:all .25s ease; pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(31,42,31,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .confirm-overlay.show{display:flex;}
  .confirm-box{
    background:var(--card); border-radius:8px; padding:20px 20px 16px;
    max-width:320px; width:100%; box-shadow:0 8px 24px rgba(0,0,0,0.28);
  }
  .confirm-box p{font-size:14.5px; color:var(--ink); margin:0 0 16px; line-height:1.5;}
  .confirm-btns{display:flex; gap:10px; justify-content:flex-end;}
  .confirm-cancel{
    background:none; border:1.5px solid var(--border); border-radius:5px; padding:8px 14px;
    font-family:var(--sans); font-size:13.5px; cursor:pointer; color:var(--ink-soft);
  }
  .confirm-ok{
    background:var(--danger); color:#fff; border:none; border-radius:5px; padding:8px 14px;
    font-family:var(--sans); font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* History */
  .hist-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin:18px 0 14px;}
  .hist-controls .field{min-width:150px;}
  .btn-export{
    font-family:var(--sans); font-weight:600; font-size:13.5px;
    background:var(--leaf); color:#FBF8F0; border:none; border-radius:5px;
    padding:10px 16px; cursor:pointer;
    box-shadow:0 2px 0 var(--leaf-dark);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-export:active{transform:translateY(2px); box-shadow:0 0 0 var(--leaf-dark);}
  .empty-msg{font-family:var(--mono); font-size:13.5px; color:var(--ink-soft); padding:30px 6px; text-align:center; border:1.5px dashed var(--border); border-radius:6px;}

  .entry-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:6px;
    padding:14px 16px; margin-bottom:12px; position:relative;
  }
  .entry-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .entry-title{font-family:var(--serif); font-weight:600; font-size:17px; color:var(--leaf-dark);}
  .entry-meta{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
  .entry-del{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; opacity:0.55;
    position:absolute; top:12px; right:12px;
  }
  .entry-del:hover{opacity:1; color:var(--danger);}
  .kv-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px 6px; margin-bottom:8px;}
  .kv{background:rgba(63,107,63,0.06); border-radius:4px; padding:6px 7px;}
  .kv .k{font-size:10px; color:var(--ink-soft); text-transform:lowercase;}
  .kv .v{font-family:var(--mono); font-size:14px; font-weight:500; color:var(--ink);}
  .kv .v.warn{color:var(--amber);}
  .kv .v.bad{color:var(--danger);}
  .entry-extra{font-size:13px; color:var(--ink-soft); line-height:1.5; border-top:1px dashed var(--border); padding-top:8px; margin-top:6px;}
  .entry-extra b{color:var(--ink); font-weight:600;}
  .vigor-tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .vigor-tag.sano{background:rgba(63,107,63,0.14); color:var(--leaf-dark);}
  .vigor-tag.alerta{background:var(--danger-bg); color:var(--danger);}

  @media (max-width:520px){
    .field-row{grid-template-columns:1fr;}
    .kv-grid{grid-template-columns:repeat(2, 1fr);}
    h1{font-size:25px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="appContent">
  <header class="top">
    <div class="eyebrow-row">
      <h1>Cuaderno de Cultivo</h1>
    </div>
    <div class="sub">HIDROGREEN</div>
    <div class="client-name-row">
      <input type="text" id="fantasyNameInput" placeholder="Nombre del cultivo (opcional, ej. Vivero Sol)" value="San José Cultiva">
    </div>
    <div class="client-code-row">
      <div class="client-code-tag" id="clientCodeTag"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabBtnForm">Nuevo registro</button>
      <button class="tab-btn" id="tabBtnHist">Historial</button>
    </div>
  </header>

  <main>
    <!-- FORM VIEW -->
    <section class="view active" id="formView">

      <div class="field-row single" style="margin:14px 0 0;">
        <div class="field-row" style="margin-bottom:0;">
          <div class="field">
            <label for="fFecha">Fecha</label>
            <input type="date" id="fFecha">
          </div>
          <div class="field">
            <label for="fHora">Hora</label>
            <input type="time" id="fHora">
          </div>
        </div>
      </div>

      <!-- Sección 1: Solución nutritiva -->
      <div class="field-section sol">
        <div class="sec-head">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6B3F" stroke-width="1.6"><path d="M12 2c-4 5-7 8.5-7 12.5A7 7 0 0 0 12 22a7 7 0 0 0 7-7.5C19 10.5 16 7 12 2Z"/></svg>
          <h2>Solución nutritiva</h2>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fNivelSistema">Nivel del sistema</label>
            <select id="fNivelSistema">
              <option value="80%">80%</option>
              <option value="60%">60%</option>
              <option value="40%">40%</option>
              <option value="otro">Otro…</option>
            </select>
            <input type="text" class="otro-text" id="fNivelSistemaOtro" placeholder="especificar nivel" style="display:none;">
            <span class="hint">referencia: bin de 20 L (balde de pintura)</span>
          </div>
          <div class="field" style="align-items:center;">
            <label>Niveles de referencia</label>
            <svg viewBox="0 0 190 150" width="150" height="118">
              <ellipse cx="65" cy="20" rx="42" ry="9" fill="none" stroke="#54614F" stroke-width="1.6"/>
              <line x1="23" y1="20" x2="23" y2="128" stroke="#54614F" stroke-width="1.6"/>
              <line x1="107" y1="20" x2="107" y2="128" stroke="#54614F" stroke-width="1.6"/>
              <path d="M23 128 A42 9 0 0 0 107 128" fill="none" stroke="#54614F" stroke-width="1.6"/>
              <ellipse cx="65" cy="42" rx="42" ry="9" fill="none" stroke="#3F6B3F" stroke-width="1.8" stroke-dasharray="5 4"/>
              <text x="112" y="46" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2A4A2A">80%</text>
              <ellipse cx="65" cy="66" rx="42" ry="9" fill="none" stroke="#A9673B" stroke-width="1.8" stroke-dasharray="5 4"/>
              <text x="112" y="70" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8A5230">60%</text>
              <ellipse cx="65" cy="90" rx="42" ry="9" fill="none" stroke="#B9822C" stroke-width="1.8" stroke-dasharray="5 4"/>
              <text x="112" y="94" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#B9822C">40%</text>
            </svg>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fEcMedida">EC medida (mS/cm)</label>
            <input type="number" id="fEcMedida" step="0.01" placeholder="0.00">
            <span class="hint" id="hintEc">rango sugerido 0.5–2.5</span>
          </div>
          <div class="field">
            <label for="fPhMedida">pH medido</label>
            <input type="number" id="fPhMedida" step="0.01" placeholder="0.00">
            <span class="hint" id="hintPh">rango sugerido 5.5–6.5</span>
          </div>
        </div>
      </div>

      <!-- Sección 2: Ambiente -->
      <div class="field-section amb">
        <div class="sec-head">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9673B" stroke-width="1.6"><path d="M10 14.76V4a2 2 0 1 1 4 0v10.76a4 4 0 1 1-4 0Z"/><circle cx="12" cy="17" r="1.2" fill="#A9673B" stroke="none"/></svg>
          <h2>Ambiente</h2>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fTempMin">Temp. ambiente (°C)</label>
            <input type="number" id="fTempMin" step="0.1">
          </div>
          <div class="field">
            <label for="fHumedad">Humedad (%)</label>
            <input type="number" id="fHumedad" step="1" min="0" max="100">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fTempSol">Temp. solución/agua (°C)</label>
            <input type="number" id="fTempSol" step="0.1">
          </div>
        </div>
      </div>

      <!-- Sección 3: Planta -->
      <div class="field-section planta">
        <div class="sec-head">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9822C" stroke-width="1.6"><path d="M12 22V12M12 12C12 7 8 5 4 5c0 5 3 8 8 8ZM12 12c0-4 3-6 8-6 0 5-4 8-8 8"/></svg>
          <h2>Planta</h2>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fPlanta">Sistema</label>
            <select id="fPlanta">
              <option value="">Seleccionar…</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="field">
            <label for="fEtapa">Etapa</label>
            <select id="fEtapa">
              <option value="Plántula">Plántula</option>
              <option value="Vegetativo">Vegetativo</option>
              <option value="Floración">Floración</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fAltura">Altura promedio (cm)</label>
            <input type="number" id="fAltura" step="0.5" min="0">
          </div>
          <div class="field">
            <label for="fSintomas">Síntomas</label>
            <select id="fSintomas">
              <option value="Ninguno">Ninguno</option>
              <option value="Deficiencia">Deficiencia</option>
              <option value="Exceso">Exceso</option>
              <option value="Plaga">Plaga</option>
              <option value="otro">Otro…</option>
            </select>
            <input type="text" class="otro-text" id="fSintomasOtro" placeholder="especificar" style="display:none;">
          </div>
        </div>

        <div class="field">
          <label>Color / Vigor</label>
          <div class="stamp-row">
            <div class="stamp sano selected" id="stampSano">✔ sano</div>
            <div class="stamp alerta" id="stampAlerta">✘ alerta</div>
          </div>
        </div>

        <div class="field">
          <label>Intervenciones</label>
          <div class="check-row">
            <label class="check-item"><input type="checkbox" id="fIntPoda"> Poda</label>
            <label class="check-item"><input type="checkbox" id="fIntRiego"> Riego</label>
            <label class="check-item"><input type="checkbox" id="fIntOtro"> Otro</label>
          </div>
          <input type="text" class="otro-text" id="fIntOtroText" placeholder="especificar intervención" style="display:none;">
        </div>
      </div>

      <!-- Sección 4: Responsable -->
      <div class="field-section resp">
        <div class="sec-head">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#54614F" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>
          <h2>Responsable</h2>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fResponsable">Nombre</label>
            <input type="text" id="fResponsable" placeholder="ej. Nicolás">
          </div>
          <div></div>
        </div>

        <div class="field-row single">
          <div class="field">
            <label for="fObs">Observaciones rápidas</label>
            <textarea id="fObs" placeholder="notas del día, olores, plagas, ajustes…"></textarea>
          </div>
        </div>
      </div>

      <div class="submit-row">
        <button class="btn-save" id="btnGuardar">Guardar registro</button>
      </div>
    </section>

    <!-- HISTORY VIEW -->
    <section class="view" id="histView">
      <div class="hist-controls">
        <div class="field">
          <label for="filterPlanta">Filtrar por sistema</label>
          <select id="filterPlanta">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="field">
          <label for="filterOrden">Orden</label>
          <select id="filterOrden">
            <option value="desc">Más reciente primero</option>
            <option value="asc">Más antiguo primero</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn-export" id="btnExport">Exportar a Excel</button>
        </div>
      </div>
      <div id="histList"></div>
    </section>
  </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="confirm-btns">
      <button id="confirmCancelBtn" class="confirm-cancel">Cancelar</button>
      <button id="confirmOkBtn" class="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<script>
(async function(){
  const $ = (id) => document.getElementById(id);

  // ---------- Código de cliente ----------
  // Este archivo es la plantilla base para un solo cliente/cultivo.
  // Para armar la copia de un cliente nuevo: cambiá SOLO esta línea y publicá
  // esa copia como un artefacto aparte, con su propio link.
  const clientCode = 'SAN-JOSE-CULTIVA';

  const entriesPrefix = `entries:${clientCode}:`;
  const nameKey = `client-name:${clientCode}`;
  $('clientCodeTag').textContent = `código: ${clientCode}`;

  // ---------- Tabs ----------
  const tabBtnForm = $('tabBtnForm'), tabBtnHist = $('tabBtnHist');
  const formView = $('formView'), histView = $('histView');
  function showTab(which){
    if(which==='form'){
      formView.classList.add('active'); histView.classList.remove('active');
      tabBtnForm.classList.add('active'); tabBtnHist.classList.remove('active');
    } else {
      histView.classList.add('active'); formView.classList.remove('active');
      tabBtnHist.classList.add('active'); tabBtnForm.classList.remove('active');
      renderHistory();
    }
  }
  tabBtnForm.addEventListener('click', ()=>showTab('form'));
  tabBtnHist.addEventListener('click', ()=>showTab('hist'));

  // ---------- Defaults ----------
  function pad(n){return String(n).padStart(2,'0');}
  function setNowDefaults(){
    const now = new Date();
    $('fFecha').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    $('fHora').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }
  setNowDefaults();

  // ---------- Otro reveals ----------
  function wireOtro(selectId, textId){
    const sel = $(selectId), txt = $(textId);
    sel.addEventListener('change', ()=>{
      txt.style.display = sel.value === 'otro' ? 'block' : 'none';
      if(sel.value !== 'otro') txt.value = '';
    });
  }
  wireOtro('fNivelSistema','fNivelSistemaOtro');
  wireOtro('fSintomas','fSintomasOtro');
  $('fIntOtro').addEventListener('change', ()=>{
    $('fIntOtroText').style.display = $('fIntOtro').checked ? 'block' : 'none';
    if(!$('fIntOtro').checked) $('fIntOtroText').value = '';
  });

  // ---------- Stamp toggle ----------
  const stampSano = $('stampSano'), stampAlerta = $('stampAlerta');
  let vigor = 'sano';
  stampSano.addEventListener('click', ()=>{ vigor='sano'; stampSano.classList.add('selected'); stampAlerta.classList.remove('selected'); });
  stampAlerta.addEventListener('click', ()=>{ vigor='alerta'; stampAlerta.classList.add('selected'); stampSano.classList.remove('selected'); });

  // ---------- Validation hints ----------
  function wireRangeHint(inputId, hintId, min, max){
    const input = $(inputId), hint = $(hintId);
    const baseText = hint.textContent;
    input.addEventListener('input', ()=>{
      const v = parseFloat(input.value);
      input.classList.remove('flag-warn','flag-bad');
      hint.classList.remove('warn','bad');
      if(input.value === '' || isNaN(v)){ hint.textContent = baseText; return; }
      if(v < min || v > max){
        hint.textContent = `fuera de rango sugerido (${min}–${max})`;
        hint.classList.add('warn');
        input.classList.add('flag-warn');
      } else {
        hint.textContent = baseText;
      }
    });
  }
  wireRangeHint('fEcMedida','hintEc',0.5,2.5);
  wireRangeHint('fPhMedida','hintPh',5.5,6.5);

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  // ---------- Confirmación propia (no depende del diálogo nativo del navegador) ----------
  function askConfirm(msg){
    return new Promise((resolve) => {
      $('confirmMsg').textContent = msg;
      $('confirmOverlay').classList.add('show');
      const okBtn = $('confirmOkBtn'), cancelBtn = $('confirmCancelBtn');
      function cleanup(result){
        $('confirmOverlay').classList.remove('show');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  // ---------- ISO week ----------
  function isoWeek(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const target = new Date(d.valueOf());
    const dayNr = (d.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = new Date(target.getFullYear(),0,4);
    const diff = target - firstThursday;
    return 1 + Math.round(diff / (7*24*60*60*1000));
  }

  // ---------- Storage helpers ----------
  async function safeSet(key, value, shared){
    try{
      const res = await window.storage.set(key, value, shared);
      if(!res) throw new Error('sin resultado');
      return res;
    }catch(e){
      console.error('Error guardando', e);
      throw e;
    }
  }
  async function safeGet(key, shared){
    try{
      return await window.storage.get(key, shared);
    }catch(e){
      return null;
    }
  }
  async function safeDelete(key, shared){
    try{
      return await window.storage.delete(key, shared);
    }catch(e){
      return null;
    }
  }
  async function safeList(prefix, shared){
    try{
      const res = await window.storage.list(prefix, shared);
      return res ? res.keys : [];
    }catch(e){
      return [];
    }
  }

  // ---------- Save entry ----------
  function collectEntry(){
    const intervenciones = [];
    if($('fIntPoda').checked) intervenciones.push('Poda');
    if($('fIntRiego').checked) intervenciones.push('Riego');
    if($('fIntOtro').checked) intervenciones.push($('fIntOtroText').value.trim() || 'Otro');

    const sintomas = $('fSintomas').value === 'otro' ? ($('fSintomasOtro').value.trim() || 'Otro') : $('fSintomas').value;
    const nivelSistema = $('fNivelSistema').value === 'otro' ? ($('fNivelSistemaOtro').value.trim() || 'Otro') : $('fNivelSistema').value;

    return {
      fecha: $('fFecha').value,
      hora: $('fHora').value,
      semana: isoWeek($('fFecha').value),
      nivelSistema,
      ecMedida: $('fEcMedida').value,
      phMedida: $('fPhMedida').value,
      tempMin: $('fTempMin').value,
      humedad: $('fHumedad').value,
      tempSol: $('fTempSol').value,
      planta: $('fPlanta').value,
      etapa: $('fEtapa').value,
      altura: $('fAltura').value,
      vigor,
      sintomas,
      intervenciones,
      responsable: $('fResponsable').value.trim(),
      observaciones: $('fObs').value.trim(),
      createdAt: Date.now()
    };
  }

  function clearForm(){
    $('fEcMedida').value=''; $('fPhMedida').value='';
    $('fNivelSistema').value='80%'; $('fNivelSistemaOtro').value=''; $('fNivelSistemaOtro').style.display='none';
    $('fTempMin').value=''; $('fHumedad').value=''; $('fTempSol').value='';
    $('fPlanta').value=''; $('fEtapa').value='Plántula'; $('fAltura').value='';
    $('fSintomas').value='Ninguno'; $('fSintomasOtro').value=''; $('fSintomasOtro').style.display='none';
    $('fIntPoda').checked=false; $('fIntRiego').checked=false; $('fIntOtro').checked=false;
    $('fIntOtroText').value=''; $('fIntOtroText').style.display='none';
    $('fResponsable').value=''; $('fObs').value='';
    vigor='sano'; stampSano.classList.add('selected'); stampAlerta.classList.remove('selected');
    $('hintEc').textContent='rango sugerido 0.5–2.5'; $('hintEc').classList.remove('warn','bad');
    $('hintPh').textContent='rango sugerido 5.5–6.5'; $('hintPh').classList.remove('warn','bad');
    $('fEcMedida').classList.remove('flag-warn','flag-bad');
    $('fPhMedida').classList.remove('flag-warn','flag-bad');
    setNowDefaults();
  }

  $('btnGuardar').addEventListener('click', async ()=>{
    if(!$('fPlanta').value){
      showToast('Seleccioná el sistema antes de guardar');
      $('fPlanta').focus();
      return;
    }
    if(!$('fResponsable').value.trim()){
      showToast('Ingresá quién completa el registro');
      $('fResponsable').focus();
      return;
    }
    const entry = collectEntry();
    const key = `${entriesPrefix}${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    $('btnGuardar').disabled = true;
    $('btnGuardar').textContent = 'Guardando…';
    try{
      await safeSet(key, JSON.stringify(entry), true);
      showToast('Registro guardado ✓');
      clearForm();
      showTab('hist');
    }catch(e){
      showToast('No se pudo guardar. Probá de nuevo.');
    }finally{
      $('btnGuardar').disabled = false;
      $('btnGuardar').textContent = 'Guardar registro';
    }
  });

  // ---------- History ----------
  let latestFilteredEntries = [];

  async function loadAllEntries(){
    const keys = await safeList(entriesPrefix, true);
    const results = await Promise.all(keys.map(k => safeGet(k, true)));
    const entries = [];
    results.forEach((r, i) => {
      if(r && r.value){
        try{
          const parsed = JSON.parse(r.value);
          parsed._key = keys[i];
          entries.push(parsed);
        }catch(e){}
      }
    });
    return entries;
  }

  function fmtVal(v, unit){
    if(v === undefined || v === null || v === '') return '—';
    return `${v}${unit||''}`;
  }
  function flagClass(v, min, max){
    if(v === '' || v === undefined || v === null) return '';
    const n = parseFloat(v);
    if(isNaN(n)) return '';
    return (n < min || n > max) ? 'warn' : '';
  }

  async function renderHistory(){
    const list = $('histList');
    list.innerHTML = '<div class="empty-msg">Cargando registros…</div>';
    const entries = await loadAllEntries();

    // populate plant filter
    const filterSel = $('filterPlanta');
    const currentFilterVal = filterSel.value;
    const plantas = Array.from(new Set(entries.map(e=>e.planta).filter(Boolean))).sort();
    filterSel.innerHTML = '<option value="">Todas</option>' + plantas.map(p=>`<option value="${p}">${p}</option>`).join('');
    filterSel.value = plantas.includes(currentFilterVal) ? currentFilterVal : '';

    renderFilteredList(entries);
  }

  function renderFilteredList(entries){
    const list = $('histList');
    const plantaFilter = $('filterPlanta').value;
    const orden = $('filterOrden').value;

    let filtered = entries.filter(e => !plantaFilter || e.planta === plantaFilter);
    filtered.sort((a,b)=>{
      const ta = new Date(`${a.fecha}T${a.hora||'00:00'}`).getTime() || a.createdAt || 0;
      const tb = new Date(`${b.fecha}T${b.hora||'00:00'}`).getTime() || b.createdAt || 0;
      return orden === 'desc' ? tb - ta : ta - tb;
    });

    if(filtered.length === 0){
      latestFilteredEntries = [];
      list.innerHTML = '<div class="empty-msg">Todavía no hay registros para mostrar.<br>Cargá uno desde "Nuevo registro".</div>';
      return;
    }

    latestFilteredEntries = filtered;

    list.innerHTML = filtered.map(e => {
      const ecClass = flagClass(e.ecMedida, 0.5, 2.5);
      const phClass = flagClass(e.phMedida, 5.5, 6.5);
      const vigorTag = e.vigor === 'alerta'
        ? '<span class="vigor-tag alerta">✘ alerta</span>'
        : '<span class="vigor-tag sano">✔ sano</span>';
      const intervenciones = (e.intervenciones && e.intervenciones.length) ? e.intervenciones.join(', ') : 'Ninguna';
      return `
        <div class="entry-card">
          <button class="entry-del" data-key="${e._key}" title="Eliminar registro">✕</button>
          <div class="entry-top">
            <div class="entry-title">Sistema ${escapeHtml(e.planta || '—')} · ${escapeHtml(e.etapa || '')} ${vigorTag}</div>
            <div class="entry-meta">${e.fecha || ''} ${e.hora || ''} · sem ${e.semana || '—'} · ${escapeHtml(e.responsable || '—')}</div>
          </div>
          <div class="kv-grid">
            <div class="kv"><div class="k">ec medida</div><div class="v ${ecClass}">${fmtVal(e.ecMedida)}</div></div>
            <div class="kv"><div class="k">ph medido</div><div class="v ${phClass}">${fmtVal(e.phMedida)}</div></div>
            <div class="kv"><div class="k">humedad</div><div class="v">${fmtVal(e.humedad,'%')}</div></div>
            <div class="kv"><div class="k">temp. sol.</div><div class="v">${fmtVal(e.tempSol,'°C')}</div></div>
            <div class="kv"><div class="k">temp. amb.</div><div class="v">${fmtVal(e.tempMin,'°C')}</div></div>
            <div class="kv"><div class="k">nivel sistema</div><div class="v">${fmtVal(e.nivelSistema)}</div></div>
            <div class="kv"><div class="k">altura</div><div class="v">${fmtVal(e.altura,'cm')}</div></div>
          </div>
          <div class="entry-extra">
            <div><b>Síntomas:</b> ${escapeHtml(e.sintomas||'Ninguno')} · <b>Intervenciones:</b> ${escapeHtml(intervenciones)}</div>
            ${e.observaciones ? `<div><b>Notas:</b> ${escapeHtml(e.observaciones)}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('.entry-del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await askConfirm('¿Eliminar este registro? Esta acción no se puede deshacer.');
        if(!ok) return;
        const key = btn.getAttribute('data-key');
        await safeDelete(key, true);
        showToast('Registro eliminado');
        renderHistory();
      });
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  $('filterPlanta').addEventListener('change', renderHistory);
  $('filterOrden').addEventListener('change', renderHistory);

  $('btnExport').addEventListener('click', ()=>{
    if(!latestFilteredEntries.length){
      showToast('No hay registros para exportar');
      return;
    }
    if(typeof XLSX === 'undefined'){
      showToast('No se pudo cargar el módulo de exportación');
      return;
    }
    const rows = latestFilteredEntries.map(e => ({
      'Fecha': e.fecha || '',
      'Hora': e.hora || '',
      'Semana': e.semana || '',
      'Sistema': e.planta || '',
      'Etapa': e.etapa || '',
      'Nivel del sistema': e.nivelSistema || '',
      'EC medida': e.ecMedida || '',
      'pH medido': e.phMedida || '',
      'Temp. ambiente (°C)': e.tempMin || '',
      'Humedad (%)': e.humedad || '',
      'Temp. solución (°C)': e.tempSol || '',
      'Altura (cm)': e.altura || '',
      'Vigor': e.vigor === 'alerta' ? 'Alerta' : 'Sano',
      'Síntomas': e.sintomas || '',
      'Intervenciones': (e.intervenciones || []).join(', '),
      'Responsable': e.responsable || '',
      'Observaciones': e.observaciones || ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Registro de cultivo');
    const today = new Date();
    const fname = `registro_cultivo_${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('Excel descargado ✓');
  });

  // ---------- Nombre de fantasía (cosmético, por cliente) ----------
  (async function loadFantasyName(){
    const res = await safeGet(nameKey, true);
    if(res && res.value){
      $('fantasyNameInput').value = res.value;
    }
  })();

  let fantasyNameSaveTimer;
  $('fantasyNameInput').addEventListener('input', ()=>{
    clearTimeout(fantasyNameSaveTimer);
    fantasyNameSaveTimer = setTimeout(async ()=>{
      const val = $('fantasyNameInput').value.trim();
      try{
        if(val){
          await safeSet(nameKey, val, true);
        } else {
          await safeDelete(nameKey, true);
        }
      }catch(e){}
    }, 700);
  });

})();
</script>
</body>
</html>
